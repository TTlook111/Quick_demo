<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NL2SQL Demo</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/main.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="toast-container" id="toast-container"></div>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3>🕐 查询历史</h3>
                <button class="clear-btn" onclick="clearAllHistory()">清空</button>
            </div>
            <div class="history-list" id="history-list">
                <div class="history-empty">暂无查询记录</div>
            </div>
        </aside>

        <main class="main">
            <div class="container">
                <div class="header">
                    <div class="theme-toggle" onclick="toggleTheme()" title="切换主题">🌙</div>
                    <div class="header-icon">⚡</div>
                    <h1>NL2SQL Demo</h1>
                    <p class="subtitle">用自然语言查询数据库 · AI 自动生成安全 SQL · 智能可视化</p>
                </div>

                <!-- 多轮对话上下文提示 -->
                <div class="context-banner" id="context-banner">
                    <span>💡 多轮对话模式：AI 会参考之前的查询上下文（<span id="context-count">0</span> 轮）</span>
                    <button onclick="clearContext()">清除上下文</button>
                </div>

                <!-- 数据源选择器：选择当前对话使用的数据库 -->
                <div class="datasource-bar" id="datasource-bar" style="display: none;">
                    <label>🗄️ 数据源</label>
                    <select class="datasource-select" id="datasource-select" onchange="onDatasourceChange()"></select>
                    <span class="ds-type-badge" id="ds-type-badge"></span>
                    <button class="ds-refresh-btn" onclick="refreshSchema()" title="刷新 Schema">🔄 刷新</button>
                    <a class="ds-manage-btn" href="/datasources">⚙️ 管理数据源</a>
                </div>

                <div class="input-card">
                    <div class="input-group">
                        <div class="input-wrapper">
                            <input type="text" id="question" placeholder="输入问题，支持追问如"只看技术部的"、"按薪资排序"" autocomplete="off" />
                        </div>
                        <button class="submit-btn" id="submit-btn" onclick="submitQuery()">查询</button>
                    </div>
                    <div class="examples">
                        <span class="examples-label">试试 →</span>
                        <button class="example-chip" onclick="fillExample(this)">技术部有多少人？</button>
                        <button class="example-chip" onclick="fillExample(this)">薪资最高的3个人</button>
                        <button class="example-chip" onclick="fillExample(this)">各部门平均薪资</button>
                        <button class="example-chip" onclick="fillExample(this)">各状态的订单数量</button>
                        <button class="example-chip" onclick="fillExample(this)">每月订单总金额</button>
                    </div>
                </div>

                <div class="result-card" id="result"></div>
            </div>
        </main>
    </div>

    <script src="/static/js/common.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
