<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NL2SQL Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
        }

        .layout { display: flex; min-height: 100vh; }

        /* 侧边栏 */
        .sidebar {
            width: 280px;
            background: white;
            border-right: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px 16px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #f3f4f6;
        }

        .sidebar-header h3 {
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .clear-btn {
            font-size: 11px;
            color: #9ca3af;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .clear-btn:hover { color: #ef4444; background: #fef2f2; }

        .history-list { flex: 1; overflow-y: auto; padding: 8px; }

        .history-item {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 2px;
            position: relative;
            transition: background 0.15s;
        }

        .history-item:hover { background: #f9fafb; }

        .history-item .question {
            font-size: 13px;
            color: #374151;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .history-item .time { font-size: 11px; color: #9ca3af; margin-top: 4px; }

        .history-item .row-count {
            font-size: 10px;
            color: #6b7280;
            background: #f3f4f6;
            padding: 1px 6px;
            border-radius: 8px;
            display: inline-block;
            margin-top: 3px;
        }

        .history-item .delete-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 20px;
            height: 20px;
            border-radius: 4px;
            border: none;
            background: none;
            color: #9ca3af;
            cursor: pointer;
            font-size: 12px;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .history-item:hover .delete-btn { display: flex; }
        .history-item .delete-btn:hover { background: #fef2f2; color: #ef4444; }

        .history-empty { padding: 40px 20px; text-align: center; color: #9ca3af; font-size: 13px; }

        /* 主区域 */
        .main { flex: 1; padding: 40px 24px; overflow-y: auto; }
        .container { max-width: 860px; margin: 0 auto; }

        .header { text-align: center; margin-bottom: 36px; }

        .header-icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            border-radius: 13px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-bottom: 14px;
            box-shadow: 0 4px 16px rgba(79, 70, 229, 0.25);
        }

        h1 { font-size: 26px; font-weight: 700; color: #1a1a2e; margin-bottom: 6px; }
        .subtitle { color: #666; font-size: 14px; }

        /* 对话上下文提示 */
        .context-banner {
            background: #fefce8;
            border: 1px solid #fde68a;
            border-radius: 8px;
            padding: 8px 14px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: #92400e;
            display: none;
        }

        .context-banner.visible { display: flex; }

        .context-banner button {
            font-size: 11px;
            color: #92400e;
            background: rgba(146, 64, 14, 0.1);
            border: none;
            padding: 3px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        .context-banner button:hover { background: rgba(146, 64, 14, 0.2); }

        /* 输入卡片 */
        .input-card {
            background: white;
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            margin-bottom: 24px;
        }

        .input-group { display: flex; gap: 12px; }
        .input-wrapper { flex: 1; }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 14px;
            color: #1a1a2e;
            transition: all 0.2s;
            outline: none;
        }

        input[type="text"]::placeholder { color: #9ca3af; }
        input[type="text"]:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }

        .submit-btn {
            padding: 12px 24px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .submit-btn:hover { background: #4338ca; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }
        .submit-btn:disabled { background: #9ca3af; cursor: not-allowed; transform: none; box-shadow: none; }

        .examples { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .examples-label { font-size: 12px; color: #9ca3af; }

        .example-chip {
            padding: 5px 12px;
            background: #f0f0ff;
            color: #4f46e5;
            border: 1px solid #e0e0ff;
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .example-chip:hover { background: #e0e0ff; transform: translateY(-1px); }

        /* 结果卡片 */
        .result-card {
            background: white;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .result-card.visible { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-label { font-size: 12px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }

        .sql-block {
            background: #1e1e2e;
            border-radius: 10px;
            padding: 14px 18px;
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 13px;
            color: #a6e3a1;
            overflow-x: auto;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .sql-block .keyword { color: #cba6f7; }

        /* SQL 可编辑 */
        .sql-section { position: relative; margin-bottom: 20px; }

        .sql-editor {
            background: #1e1e2e;
            border-radius: 10px;
            padding: 14px 18px;
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 13px;
            color: #a6e3a1;
            border: 2px solid transparent;
            outline: none;
            width: 100%;
            min-height: 60px;
            resize: vertical;
            line-height: 1.6;
            transition: border-color 0.2s;
        }

        .sql-editor:focus { border-color: #4f46e5; }

        .sql-editor.modified { border-color: #f59e0b; }

        .sql-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            align-items: center;
        }

        .sql-actions .run-btn {
            padding: 6px 16px;
            background: #059669;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }

        .sql-actions .run-btn:hover { background: #047857; }
        .sql-actions .run-btn:disabled { background: #9ca3af; cursor: not-allowed; }

        .sql-actions .hint {
            font-size: 11px;
            color: #9ca3af;
        }

        .sql-actions .hint.modified-hint { color: #f59e0b; }

        /* AI 解读 */
        .explain-section {
            background: linear-gradient(135deg, #f0f9ff, #eff6ff);
            border: 1px solid #bfdbfe;
            border-radius: 10px;
            padding: 16px 20px;
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease;
        }

        .explain-section .explain-header {
            font-size: 12px;
            font-weight: 600;
            color: #1d4ed8;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .explain-section .explain-text { font-size: 14px; color: #1e3a5f; line-height: 1.7; }

        .explain-loading { font-size: 13px; color: #6b7280; display: flex; align-items: center; gap: 8px; }
        .explain-loading .dot-pulse { display: inline-block; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        /* 工具栏：视图切换 + 导出 */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .view-toggle { display: flex; gap: 6px; }

        .toggle-btn {
            padding: 6px 14px;
            border: 1px solid #e5e7eb;
            background: white;
            border-radius: 8px;
            font-size: 12px;
            color: #6b7280;
            cursor: pointer;
            transition: all 0.15s;
        }

        .toggle-btn.active { background: #4f46e5; color: white; border-color: #4f46e5; }
        .toggle-btn:hover:not(.active) { background: #f9fafb; }

        .export-group { display: flex; gap: 6px; }

        .export-btn {
            padding: 6px 12px;
            border: 1px solid #e5e7eb;
            background: white;
            border-radius: 8px;
            font-size: 11px;
            color: #6b7280;
            cursor: pointer;
            transition: all 0.15s;
        }

        .export-btn:hover { background: #f0fdf4; border-color: #a7f3d0; color: #059669; }

        /* 图表 */
        .chart-container { position: relative; width: 100%; max-height: 380px; margin: 0 auto; }

        .chart-type-selector { display: flex; gap: 6px; margin-bottom: 12px; }

        .chart-type-btn {
            padding: 5px 12px;
            border: 1px solid #e5e7eb;
            background: white;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            color: #6b7280;
            transition: all 0.15s;
        }

        .chart-type-btn.active { background: #ecfdf5; color: #059669; border-color: #a7f3d0; }

        /* 表格 */
        .table-wrapper { overflow-x: auto; border-radius: 10px; border: 1px solid #e5e7eb; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: #f9fafb; padding: 10px 14px; text-align: left; font-weight: 600; color: #374151; border-bottom: 1px solid #e5e7eb; font-size: 12px; }
        td { padding: 9px 14px; border-bottom: 1px solid #f3f4f6; color: #4b5563; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f8f9ff; }

        .meta { margin-top: 14px; font-size: 12px; color: #9ca3af; display: flex; align-items: center; gap: 8px; }
        .meta .badge { background: #ecfdf5; color: #059669; padding: 2px 10px; border-radius: 10px; font-weight: 500; }

        .error-block { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; padding: 16px 20px; border-radius: 10px; font-size: 14px; }

        .loading { display: flex; flex-direction: column; align-items: center; padding: 40px 0; gap: 12px; }
        .loading-spinner { width: 30px; height: 30px; border: 3px solid #e5e7eb; border-top-color: #4f46e5; border-radius: 50%; animation: spin 0.7s linear infinite; }
        .loading-text { color: #6b7280; font-size: 13px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .layout { flex-direction: column; }
            .sidebar { width: 100%; max-height: 200px; border-right: none; border-bottom: 1px solid #e5e7eb; }
            .input-group { flex-direction: column; }
            .submit-btn { width: 100%; }
            .toolbar { flex-direction: column; gap: 8px; align-items: flex-start; }

        /* Toast 通知 */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 13px;
            color: white;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            animation: toastIn 0.3s ease, toastOut 0.3s ease 3s forwards;
            max-width: 360px;
            word-break: break-word;
        }

        .toast.success { background: #059669; }
        .toast.error { background: #dc2626; }
        .toast.warning { background: #d97706; }
        .toast.info { background: #4f46e5; }

        @keyframes toastIn {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes toastOut {
            from { opacity: 1; }
            to { opacity: 0; transform: translateY(-10px); }
        }

        /* 空结果提示 */
        .empty-result {
            text-align: center;
            padding: 40px 20px;
            color: #6b7280;
        }

        .empty-result .empty-icon { font-size: 40px; margin-bottom: 12px; }
        .empty-result .empty-title { font-size: 15px; font-weight: 600; color: #374151; margin-bottom: 6px; }
        .empty-result .empty-desc { font-size: 13px; color: #9ca3af; }

        /* 自动修复提示 */
        .auto-fix-banner {
            background: #fefce8;
            border: 1px solid #fde68a;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 16px;
            font-size: 12px;
            color: #92400e;
            display: flex;
            align-items: center;
            gap: 6px;
        }

    </style>
</head>
<body>
    <div class="toast-container" id="toast-container"></div>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3>🕐 查询历史</h3>
                <button class="clear-btn" onclick="clearAllHistory()">清空</button>
            </div>
            <div class="history-list" id="history-list">
                <div class="history-empty">暂无查询记录</div>
            </div>
        </aside>

        <main class="main">
            <div class="container">
                <div class="header">
                    <div class="header-icon">⚡</div>
                    <h1>NL2SQL Demo</h1>
                    <p class="subtitle">用自然语言查询数据库 · AI 自动生成安全 SQL · 智能可视化</p>
                </div>

                <!-- 多轮对话上下文提示 -->
                <div class="context-banner" id="context-banner">
                    <span>💡 多轮对话模式：AI 会参考之前的查询上下文（<span id="context-count">0</span> 轮）</span>
                    <button onclick="clearContext()">清除上下文</button>
                </div>

                <div class="input-card">
                    <div class="input-group">
                        <div class="input-wrapper">
                            <input type="text" id="question" placeholder="输入问题，支持追问如"只看技术部的"、"按薪资排序"" autocomplete="off" />
                        </div>
                        <button class="submit-btn" id="submit-btn" onclick="submitQuery()">查询</button>
                    </div>
                    <div class="examples">
                        <span class="examples-label">试试 →</span>
                        <button class="example-chip" onclick="fillExample(this)">技术部有多少人？</button>
                        <button class="example-chip" onclick="fillExample(this)">薪资最高的3个人</button>
                        <button class="example-chip" onclick="fillExample(this)">各部门平均薪资</button>
                        <button class="example-chip" onclick="fillExample(this)">各状态的订单数量</button>
                        <button class="example-chip" onclick="fillExample(this)">每月订单总金额</button>
                    </div>
                </div>

                <div class="result-card" id="result"></div>
            </div>
        </main>
    </div>

    <script>
        const input = document.getElementById('question');
        const resultDiv = document.getElementById('result');
        const submitBtn = document.getElementById('submit-btn');
        let currentChart = null;
        let currentData = null;

        // 多轮对话上下文
        let conversationHistory = [];

        loadHistory();

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !submitBtn.disabled) submitQuery();
        });

        function fillExample(btn) {
            input.value = btn.textContent;
            input.focus();
        }

        // ========== 多轮对话 ==========
        function updateContextBanner() {
            const banner = document.getElementById('context-banner');
            const count = document.getElementById('context-count');
            if (conversationHistory.length > 0) {
                banner.classList.add('visible');
                count.textContent = conversationHistory.length;
            } else {
                banner.classList.remove('visible');
            }
        }

        function clearContext() {
            conversationHistory = [];
            updateContextBanner();
        }

        // ========== 历史 ==========
        async function loadHistory() {
            try {
                const res = await fetch('/api/history');
                renderHistory(await res.json());
            } catch (e) { console.error(e); }
        }

        function renderHistory(items) {
            const list = document.getElementById('history-list');
            if (!items || items.length === 0) {
                list.innerHTML = '<div class="history-empty">暂无查询记录</div>';
                return;
            }
            list.innerHTML = items.map(item => `
                <div class="history-item" onclick="rerunQuery('${escapeAttr(item.question)}')">
                    <div class="question">${escapeHtml(item.question)}</div>
                    <div class="time">${formatTime(item.created_at)}</div>
                    <span class="row-count">${item.row_count} 条</span>
                    <button class="delete-btn" onclick="event.stopPropagation(); deleteHistoryItem(${item.id})">✕</button>
                </div>
            `).join('');
        }

        function rerunQuery(question) {
            input.value = question;
            submitQuery();
        }

        async function deleteHistoryItem(id) {
            await fetch(`/api/history/${id}`, { method: 'DELETE' });
            loadHistory();
        }

        async function clearAllHistory() {
            if (!confirm('确定清空所有查询历史？')) return;
            await fetch('/api/history', { method: 'DELETE' });
            loadHistory();
        }

        function formatTime(ts) {
            const diff = Date.now() - ts * 1000;
            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return `${Math.floor(diff / 60000)} 分钟前`;
            if (diff < 86400000) return `${Math.floor(diff / 3600000)} 小时前`;
            return new Date(ts * 1000).toLocaleDateString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        // ========== 查询 ==========
        async function submitQuery() {
            const question = input.value.trim();
            if (!question) return;

            resultDiv.className = 'result-card visible';
            resultDiv.innerHTML = '<div class="loading"><div class="loading-spinner"></div><div class="loading-text">AI 正在理解问题并生成 SQL...</div></div>';
            submitBtn.disabled = true;

            try {
                const res = await fetch('/api/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question,
                        conversation: conversationHistory.length > 0 ? conversationHistory : null
                    }),
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || '请求失败');
                }

                currentData = await res.json();
                renderResult(currentData);

                // 加入对话上下文
                conversationHistory.push({ question, sql: currentData.generated_sql });
                if (conversationHistory.length > 5) conversationHistory.shift();
                updateContextBanner();

                loadHistory();
            } catch (e) {
                resultDiv.innerHTML = `<div class="error-block">❌ ${escapeHtml(e.message)}</div>`;
                showToast(e.message, 'error');
            } finally {
                submitBtn.disabled = false;
            }
        }

        // ========== 渲染结果 ==========
        function renderResult(data) {
            const canChart = canShowChart(data);
            let html = '';

            // 自动修复提示
            if (data.auto_fixed) {
                html += `<div class="auto-fix-banner">🔧 原始 SQL 执行失败，AI 已自动修复并重新执行成功</div>`;
                showToast('SQL 已自动修复并执行成功', 'warning');
            }

            // SQL 可编辑区域
            html += `<div class="sql-section">`;
            html += `<div class="section-label">生成的 SQL（可编辑）</div>`;
            html += `<textarea class="sql-editor" id="sql-editor" spellcheck="false">${escapeHtml(data.generated_sql)}</textarea>`;
            html += `<div class="sql-actions">`;
            html += `<button class="run-btn" id="run-edited-btn" onclick="runEditedSQL()">▶ 执行</button>`;
            html += `<span class="hint" id="sql-hint">可直接编辑 SQL 后点击执行</span>`;
            html += `</div></div>`;

            // AI 解读区域
            html += `<div id="explain-area"></div>`;

            // 空结果处理
            if (data.row_count === 0) {
                html += `<div class="empty-result">
                    <div class="empty-icon">📭</div>
                    <div class="empty-title">没有匹配的数据</div>
                    <div class="empty-desc">试试换一种方式描述，或者调整查询条件</div>
                </div>`;
                resultDiv.innerHTML = html;
                setupSQLEditor(data.generated_sql);
                return;
            }

            // 工具栏
            html += `<div class="toolbar">`;
            html += `<div class="view-toggle">`;
            html += `<button class="toggle-btn ${canChart ? '' : 'active'}" onclick="switchView('table')">📋 表格</button>`;
            if (canChart) html += `<button class="toggle-btn active" onclick="switchView('chart')">📊 图表</button>`;
            html += `</div>`;
            html += `<div class="export-group">`;
            html += `<button class="export-btn" onclick="exportCSV()">📥 导出 CSV</button>`;
            if (canChart) html += `<button class="export-btn" onclick="exportChartImage()">🖼️ 导出图表</button>`;
            html += `</div>`;
            html += `</div>`;

            if (canChart) {
                html += `<div id="chart-types" class="chart-type-selector">`;
                html += `<button class="chart-type-btn active" onclick="changeChartType('bar')">柱状图</button>`;
                html += `<button class="chart-type-btn" onclick="changeChartType('pie')">饼图</button>`;
                html += `<button class="chart-type-btn" onclick="changeChartType('line')">折线图</button>`;
                html += `<button class="chart-type-btn" onclick="changeChartType('doughnut')">环形图</button>`;
                html += `</div>`;
            }

            html += `<div id="chart-view" style="${canChart ? '' : 'display:none'}"><div class="chart-container"><canvas id="resultChart"></canvas></div></div>`;

            html += `<div id="table-view" style="${canChart ? 'display:none' : ''}">`;
            if (data.rows.length > 0) {
                html += `<div class="table-wrapper"><table>`;
                html += `<thead><tr>${data.columns.map(c => `<th>${escapeHtml(c)}</th>`).join('')}</tr></thead>`;
                html += `<tbody>`;
                for (const row of data.rows) {
                    html += `<tr>${data.columns.map(c => `<td>${escapeHtml(String(row[c] ?? '-'))}</td>`).join('')}</tr>`;
                }
                html += `</tbody></table></div>`;
            } else {
                html += `<p style="color:#9ca3af;text-align:center;padding:20px;">查询成功，但没有匹配的数据</p>`;
            }
            html += `</div>`;

            html += `<div class="meta"><span class="badge">${data.row_count} 条结果</span></div>`;
            resultDiv.innerHTML = html;

            if (canChart) renderChart(data, 'bar');

            // 绑定 SQL 编辑器事件
            setupSQLEditor(data.generated_sql);

            // 自动触发 AI 解读
            fetchExplanation(data);
        }

        // ========== 导出 ==========
        function exportCSV() {
            if (!currentData || !currentData.rows.length) return;
            const { columns, rows } = currentData;

            let csv = columns.join(',') + '\n';
            for (const row of rows) {
                csv += columns.map(c => {
                    const val = String(row[c] ?? '');
                    return val.includes(',') ? `"${val}"` : val;
                }).join(',') + '\n';
            }

            downloadFile(csv, 'query_result.csv', 'text/csv');
        }

        function exportChartImage() {
            if (!currentChart) return;
            const url = currentChart.toBase64Image();
            const a = document.createElement('a');
            a.href = url;
            a.download = 'chart.png';
            a.click();
        }

        function downloadFile(content, filename, type) {
            const blob = new Blob(['\uFEFF' + content], { type: type + ';charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        // ========== 图表 ==========
        function switchView(view) {
            document.getElementById('chart-view').style.display = view === 'chart' ? '' : 'none';
            document.getElementById('table-view').style.display = view === 'table' ? '' : 'none';
            const ct = document.getElementById('chart-types');
            if (ct) ct.style.display = view === 'chart' ? 'flex' : 'none';
            document.querySelectorAll('.view-toggle .toggle-btn').forEach((btn, i) => {
                btn.classList.toggle('active', (view === 'table' && i === 0) || (view === 'chart' && i === 1));
            });
        }

        function canShowChart(data) {
            if (data.rows.length < 2 || data.columns.length < 2) return false;
            return data.columns.some(c => data.rows.every(r => !isNaN(parseFloat(r[c]))));
        }

        function getChartData(data) {
            const cols = data.columns;
            const numericCols = cols.filter(c => data.rows.every(r => !isNaN(parseFloat(r[c]))));
            const labelCol = cols.find(c => !numericCols.includes(c)) || cols[0];
            const valueCol = numericCols[0] || cols[1];
            return {
                labels: data.rows.map(r => String(r[labelCol])),
                values: data.rows.map(r => parseFloat(r[valueCol])),
                labelCol, valueCol
            };
        }

        const chartColors = [
            'rgba(79, 70, 229, 0.8)', 'rgba(6, 182, 212, 0.8)', 'rgba(16, 185, 129, 0.8)',
            'rgba(245, 158, 11, 0.8)', 'rgba(239, 68, 68, 0.8)', 'rgba(139, 92, 246, 0.8)',
            'rgba(236, 72, 153, 0.8)', 'rgba(20, 184, 166, 0.8)',
        ];

        function renderChart(data, type) {
            if (currentChart) currentChart.destroy();
            const { labels, values, valueCol } = getChartData(data);
            const canvas = document.getElementById('resultChart');
            if (!canvas) return;
            const isPie = (type === 'pie' || type === 'doughnut');

            currentChart = new Chart(canvas, {
                type,
                data: {
                    labels,
                    datasets: [{
                        label: valueCol,
                        data: values,
                        backgroundColor: isPie ? labels.map((_, i) => chartColors[i % chartColors.length]) : 'rgba(79, 70, 229, 0.7)',
                        borderColor: isPie ? 'white' : 'rgba(79, 70, 229, 1)',
                        borderWidth: 2,
                        borderRadius: isPie ? 0 : 6,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { display: isPie, position: 'bottom', labels: { padding: 14, usePointStyle: true, font: { size: 12 } } },
                        tooltip: { backgroundColor: 'rgba(0,0,0,0.8)', padding: 10, cornerRadius: 8 }
                    },
                    scales: isPie ? {} : {
                        x: { grid: { display: false }, ticks: { font: { size: 12 }, color: '#6b7280' } },
                        y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.04)' }, ticks: { font: { size: 12 }, color: '#6b7280' } }
                    },
                    animation: { duration: 500, easing: 'easeOutQuart' }
                }
            });
        }

        function changeChartType(type) {
            document.querySelectorAll('.chart-type-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.includes(
                    type === 'bar' ? '柱状' : type === 'pie' ? '饼图' : type === 'line' ? '折线' : '环形'
                ));
            });
            if (currentData) renderChart(currentData, type);
        }

        // ========== 工具函数 ==========
        function formatSQL(sql) {
            const keywords = ['SELECT', 'FROM', 'WHERE', 'JOIN', 'LEFT', 'RIGHT', 'INNER', 'ON',
                            'GROUP BY', 'ORDER BY', 'HAVING', 'LIMIT', 'AS', 'AND', 'OR', 'IN',
                            'COUNT', 'SUM', 'AVG', 'MAX', 'MIN', 'DISTINCT', 'DESC', 'ASC', 'BETWEEN'];
            let formatted = escapeHtml(sql);
            keywords.forEach(kw => {
                formatted = formatted.replace(new RegExp(`\\b${kw}\\b`, 'gi'), `<span class="keyword">${kw}</span>`);
            });
            return formatted;
        }

        // ========== SQL 可编辑 ==========
        let originalSQL = '';

        function setupSQLEditor(sql) {
            originalSQL = sql;
            const editor = document.getElementById('sql-editor');
            const hint = document.getElementById('sql-hint');
            if (!editor) return;

            editor.addEventListener('input', () => {
                const modified = editor.value.trim() !== originalSQL.trim();
                editor.classList.toggle('modified', modified);
                if (modified) {
                    hint.textContent = '⚠️ SQL 已修改，点击执行查看新结果';
                    hint.className = 'hint modified-hint';
                } else {
                    hint.textContent = '可直接编辑 SQL 后点击执行';
                    hint.className = 'hint';
                }
            });

            // Ctrl+Enter 快捷键执行
            editor.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    runEditedSQL();
                }
            });
        }

        async function runEditedSQL() {
            const editor = document.getElementById('sql-editor');
            const runBtn = document.getElementById('run-edited-btn');
            if (!editor) return;

            const sql = editor.value.trim();
            if (!sql) return;

            runBtn.disabled = true;
            runBtn.textContent = '执行中...';

            try {
                const res = await fetch('/api/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sql,
                        question: currentData?.question || null,
                    }),
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || '执行失败');
                }

                currentData = await res.json();
                renderResult(currentData);
                loadHistory();
            } catch (e) {
                showToast(e.message, 'error');
            } finally {
                runBtn.disabled = false;
                runBtn.textContent = '▶ 执行';
            }
        }

        // ========== AI 解读 ==========
        async function fetchExplanation(data) {
            const area = document.getElementById('explain-area');
            if (!area || !data.rows.length) return;

            area.innerHTML = `<div class="explain-loading"><span class="dot-pulse">💡</span> AI 正在分析结果...</div>`;

            try {
                const res = await fetch('/api/explain', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question: data.question,
                        sql: data.generated_sql,
                        columns: data.columns,
                        rows: data.rows,
                    }),
                });

                if (!res.ok) throw new Error('解读失败');

                const result = await res.json();
                area.innerHTML = `
                    <div class="explain-section">
                        <div class="explain-header">🤖 AI 解读</div>
                        <div class="explain-text">${escapeHtml(result.explanation)}</div>
                    </div>
                `;
            } catch (e) {
                area.innerHTML = '';  // 静默失败，不阻塞主流程
            }
        }

        // ========== Toast 通知 ==========
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);

            // 3.3 秒后移除（动画 3s + 缓冲）
            setTimeout(() => {
                if (toast.parentNode) toast.parentNode.removeChild(toast);
            }, 3300);
        }

        function escapeHtml(str) { return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
        function escapeAttr(str) { return str.replace(/'/g, "\\'").replace(/"/g, '&quot;'); }
    </script>
</body>
</html>
