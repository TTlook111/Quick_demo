[project]
name = "nl2sql-demo"
version = "0.2.0"
description = "Natural Language to SQL - 通过自然语言生成安全 SQL 并执行，支持多数据源（SQLite/MySQL/PostgreSQL）"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.0",
    "sqlparse>=0.5.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    # MySQL 驱动
    "pymysql>=1.1.0",
    # PostgreSQL 驱动
    "psycopg2-binary>=2.9.0",
]
